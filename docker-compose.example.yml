# iCloud to Immich: run it on your server and use it whenever you like.
#
# Paste this into your server's "compose" / "stack" / "Install via YAML" screen
# (Portainer, TrueNAS, Synology Container Manager, Unraid Compose Manager…),
# or save it as docker-compose.yml and run:  docker compose up -d
#
# Then open the app's LOGS. The link to open (with its access key) is printed
# there inside a box of ===== lines. Bookmark it.
services:
  icloud-to-immich:
    image: ghcr.io/xkenricx/icloud-to-immich:latest
    container_name: icloud-to-immich
    restart: unless-stopped
    # Signs people out after 20 minutes with the page closed (never during a copy).
    command: ["python", "main.py", "--host", "0.0.0.0", "--port", "8080", "--no-browser"]
    ports:
      - "8120:8080"      # open it at http://<your-server-address>:8120
    volumes:
      - data:/data       # keeps your progress and the access key between restarts
    # Optional settings: remove the # at the start of the lines you want.
    # environment:
    #   ICLOUD2IMMICH_IMMICH_URL: "http://192.168.1.10:2283"  # your Immich, filled in for everyone
    #   ICLOUD2IMMICH_URL: "http://192.168.1.10:8120"         # this app's address: the log shows the exact link

volumes:
  data:
